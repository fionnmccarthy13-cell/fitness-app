<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Fionn Training</title></head><body><header><div><small>12-WEEK PROGRAM</small><h1>Fionn Training</h1></div><button id="reset">Reset week</button></header><main><section class="card hero"><div><span>WEEK</span><strong id="weekLabel">1</strong></div><input id="week" type="range" min="1" max="12" value="1"><p>Weights carry forward automatically until you change them.</p></section><nav id="days"></nav><section id="workout"></section><section class="card"><h2>Weekly check-in</h2><p class="meta" id="weekDates"></p><div class="daily-table"><b>Day</b><b>Weight kg</b><b>Calories</b><span>Mon</span><input id="weightMon" inputmode="decimal"><input id="calMon" inputmode="numeric"><span>Tue</span><input id="weightTue" inputmode="decimal"><input id="calTue" inputmode="numeric"><span>Wed</span><input id="weightWed" inputmode="decimal"><input id="calWed" inputmode="numeric"><span>Thu</span><input id="weightThu" inputmode="decimal"><input id="calThu" inputmode="numeric"><span>Fri</span><input id="weightFri" inputmode="decimal"><input id="calFri" inputmode="numeric"><span>Sat</span><input id="weightSat" inputmode="decimal"><input id="calSat" inputmode="numeric"><span>Sun</span><input id="weightSun" inputmode="decimal"><input id="calSun" inputmode="numeric"></div><div class="summary"><div><span>Weekly avg weight</span><strong id="avgWeight">—</strong></div><div><span>Avg calories</span><strong id="avgCalories">—</strong></div></div><label>Avg daily steps<input id="steps" inputmode="numeric"></label><label>Notes<textarea id="notes" rows="3" placeholder="Energy, recovery, wins…"></textarea></label></section><section class="card"><h2>Progress report</h2><p class="meta">Weekly average body weight</p><canvas id="weightChart" height="220"></canvas></section></main><footer>Progress saves on this device.</footer><script src="app.js?v=7"></script></body></html>
