<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Fionn Training</title></head><body><header><div><small>12-WEEK PROGRAM</small><h1>Fionn Training</h1></div><button id="reset">Reset week</button></header><main><section class="card hero"><div><span>WEEK</span><strong id="weekLabel">1</strong></div><input id="week" type="range" min="1" max="12" value="1"><p>Weights carry forward automatically until you change them.</p></section><nav id="days"></nav><section id="workout"></section><section class="card"><h2>Weekly check-in</h2><div class="grid"><label>Body weight (kg)<input id="bodyWeight" inputmode="decimal"></label><label>Avg daily steps<input id="steps" inputmode="numeric"></label></div><label>Notes<textarea id="notes" rows="3" placeholder="Energy, recovery, wins…"></textarea></label></section></main><footer>Progress saves on this device.</footer><script src="app.js"></script></body></html>
